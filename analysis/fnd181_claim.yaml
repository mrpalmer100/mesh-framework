  times the strain gradient), from registered objects only; the same torque tilts the on-site
  potential and the vacuum ceases to exist above eps''_c = 1/c_L (a Schwinger-class breakdown
  gradient, consequence recorded). K1 on FND-STRAND-002''s chain as registered (kink relaxed
  at F = 0, then driven; two trackers agreeing to 0.1 pct; winding conserved at 0.0): the
  measured mass 2 pi F/|a| is 4.043/4.057 vs 8/w = 4.000 at w = 2 and 2.873/2.883 vs 2.857 at
