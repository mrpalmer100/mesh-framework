id: FND-175
title: 'COMMISSION KERNEL-CONT -- KC-MEMBER: THE ANTI-ALIGNED RESONANCE CARRIES A CONTINUUM
  FAMILY OF FULL-BAR MEMBERS ALONG ITS KERNEL. ON THE s-RESOLVED 288x36 CHART AT q = 5/4,
  WHERE GAUSS-NEWTON FLOORS AT RMS 1.3e-7 AT EXACT RESONANCE, A BORDERED CONTINUATION ALONG
  THE NEAR-NULL DIRECTION GATES MEMBERS AT b = -0.05, -0.10, -0.20 (RMS 6.9e-9, 6.6e-9,
  3.9e-9; om2 = -Om1/4); AT 144x36, q = 4/3, SEVEN OF SEVEN b != 0 GATE; BOTH CONTROLS PASS'
status: registered
note: 'Charter analysis/KERNEL_CONT_charter_LOCKED.md (locked 2026-09-12 before any sweep
  point; forms KC-MEMBER / KC-FLOOR / KC-A-ONLY / KC-CONTROL-FAIL / KC-REFUSED; controls c1
  and c2 fixed in advance). INSTRUMENT: benchmarks/foundations/kernel_continuation.py -- the
  bordering algorithm on the credentialed banded solver (two banded solves per round from
  one factorization; predictor along the kernel, corrector at fixed b through the
  acceptance ladder); the near-null direction found in the (1,1) harmonic subspace with the
  injection direction and its phase partner projected out (a global smallest-singular-
  direction search returns Nyquist grid modes, recorded caution). Executed on the
  author''s machines (stage A on the Mac, stage B on a Windows box after memory pressure;
  one machine per job); checkpoint analysis/kernel_cont_ckpt.pkl (sealed); c2 in the
  session; verdict once (analysis/KERNEL_CONT_verdict.log). STAGE A (144x36, cell 4/3,
  the anti-aligned state GN floored at 6.6e-7): every b != 0 gated, seven of seven, RMS
  1e-9 to 9e-9 in 6-22 rounds, om2 -1.48099 to -1.48102 (difference frequency -1.48096).
  STAGE B (288x36, cell 5/4, the ANTI-ARC-S288 state GN floored at 1.29e-7 at exact
  resonance): b = -0.20, -0.10, -0.05 GATED (RMS 3.85e-9, 6.63e-9, 6.92e-9; closure < 5e-10;
  pin held to 1e-7; om2 -1.110728 to -1.110730 vs -Om1/4 = -1.110721); b > 0 floors within
  the 40-round budget at 1.4-3x the bar (+0.2: 1.39e-8; +0.05, +0.3: 2.9e-8, 2.6e-8; +0.1
  stalled at 2.7e-6); bisection points -0.167 (1.5e-8) and -0.133 (1.9e-6) non-monotone
  between gated neighbours -- the predictor can land in a rougher basin; whether b > 0 is
  one-sided or budget-limited is OPEN (a doubled budget / smaller predictor step decides;
  a follow-on, not a rescue). CONTROLS: c1 the bordered solve at b = 0 reproduces the GN
  floor at both stages (6.15e-7 vs 6.57e-7; 7.2e-8 vs 1.29e-7) -- the instrument adds
  nothing without a degeneracy; c2 the gated ALIGNED 4/3 waypoint-1 member under the
  bordered solve at b = 0 stays gated and unchanged (RMS 1.9e-9 -> 6.5e-11, |dx|/|x| 1.7e-6,
  om2 shift 4e-6) -- and its smallest (1,1)-subspace direction is 2.3e-2 of the row norm
  against 8e-5 / 4e-5 at the resonant states: the near-null direction is a property of the
  resonance. VERDICT KC-MEMBER. WHAT IS ESTABLISHED: the continuum object of the anti-
  aligned sector (FND-172''s resonance; FND-173''s grid-condition rider) is not an empty
  degenerate point but carries a one-parameter family of full-bar members parametrized by
  the kernel coordinate; the coarse chart''s detuning had selected one member of this
  family. The sector is MARCHABLE in the continuum with the bordered solver in place of GN.
  The instrument is credentialed for its class (a single near-null direction in the
  physical harmonic subspace); its roughness in b is a known limitation. NAMED NEXT-ORDER
  (executed as KERNEL-MARCH): the anti-aligned 5/4 family marched on 288x36 with the
  bordered solver, b carried per point, the ANTI-ARC forms -- the continuum test of FND-174.
  Results analysis/KERNEL_CONT_results.md. Granted by the author 2026-09-16.'
