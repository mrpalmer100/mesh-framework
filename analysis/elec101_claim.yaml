id: ELEC-101
title: 'THE CENSUS PASS OVER PREDICTIONS 20 TO 34, UNRELAXED, PLUS THE FND-182 CANDIDATE: THE
  FIRM COUNT STAYS AT TWO PLUS ONE ADJUDICATED; SEVEN ENTRIES ARE T2, TWO T3, FOUR T4, ONE T5,
  ONE FOLDS INTO PREDICTION 6; THE CHARGE-CREATION WINDOW MEETS C2, C3, C4 AND D1 TO D3 AND
  MEETS C1 AS A BOUNDED WINDOW WHOSE NULL BRANCH FALSIFIES, A READING THE CENSUS RULE HAS NOT
  YET ADMITTED AND THE AUTHOR IS ASKED TO RULE ON'
status: registered
note: 'Reading only, sandbox, 2026-09-27; the ELEC-062 criteria and the ELEC-064 tests restated
  verbatim before any entry was read; bar B2 (no promotion for being the best available)
  applied; the ELEC-084 rule (read the competing literature) applied. The 1 August audit ran at
  19 entries and ELEC-084 covered P23 to P25; entries 20 to 22 and 26 to 34 had never been
  tiered. VERDICTS: P20 (Hawking law-form) T4 internal, no external observable; the P20 adjoint
  Casimir pin unchanged at T1 armed; P21 (lattice fork lever) T2, its external face the PVLAS
  nonlinearity beyond reach per P19''s scope correction; P22 folds into P6 as a property of its
  falsifier; P23/P24/P25 unchanged from ELEC-084 (T2/T3/T2); P26 (no finite-speed Bell cutoff)
  T3, the outcome quantum mechanics'' own; P27 (I^2 dark attenuation) T2, shape without a
  number per the P23 precedent; P28 (sign lock) T2, conditional on a LIV signal not established
  (D2), the corpus''s own photon repair having removed the mesh''s dispersive term; P29 (linked
  cutoff) T2, conditional on a measured dispersion scale and read subject to the photon
  section by the paper''s own words; P30 (massive partner >= 2e11 GeV) T2, unreachable; P31
  (kappa_0 lock) T4; P32 (zero-point share band) T4, no instrument and, per FND-178, the
  BUDGET object rather than the spectral one Casimir measures; P33 T5 (FND-166); P34 (level-2
  speed lock) T4. COUNTS: T1 two firm (P6; the P20 pin armed) plus one adjudicated (k-string);
  T2 seven; T3 two; T4 four; T5 one. THE CANDIDATE: FND-182''s charge-creation window
  [1.1e15, 3.2e18] V/m meets C2 (QED creates no charge below 1.32e18; the mesh does over most
  of the range), C3 (the laser record 9.1e14 sits below the floor; 1e24-1e25 W/cm^2 covers the
  M-point row and part of kappa_pack 50; Schwinger-class fields cover all), C4, D1 (no retired
  claim in the chain), D2 (no conditional object), D3 (the chain is built; the coarse-level
  reading is its stated conditionality). C1 holds as a WINDOW three orders wide with a
  falsifying null branch (a null at 3.2e18 V/m kills every row; at 1e16 the M-point row), which
  differs from the shape-only P23/P27 entries exactly where the ELEC-084 precedent turned;
  whether the census''s C1 admits such a window is the author''s ruling, asked here and not
  made. If admitted, the firm count becomes three; if not, FND-182 is T2 until the kink width
  or the scale set is pinned. NUCQ-001 remains OVERTURNED. Named next-orders: the C1 ruling
  (annotated on ELEC-062 either way); the paper''s reader''s note to carry entries 20 to 34 and
  the candidate with its question; pinning w (the strand mass scale in electronvolts, the same
  unregistered quantity CASIMIR-F3 found missing). Results analysis/CENSUS_P20_34_results.md.
  THE RULING (author, 2026-09-27): C1 does NOT admit a bounded window; FND-182 stays T2 until the window is a number (the strand mass scale in electronvolts pinned). Granted by the author 2026-09-27. (Id note: first drafted as ELEC-085, an id already occupied; the duplicate-id guard caught it.)'
