note: 'Charter analysis/KERNEL_MARCH2_charter_LOCKED.md (locked 2026-09-17 before any point
  beyond p29; forms KM2-REGULAR-FLAT / REGULAR-COLLAPSE / COLLAPSE-EARLY / NOT-REGULAR /
