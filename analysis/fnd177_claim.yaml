  bordered arc march, ds 0.08) continued from p30 to p89, A2 0.0054 -> 0.0102, on the
  author''s Windows box; sealed checkpoint analysis/kernel_march_ckpt.pkl; verdict once
  (analysis/KERNEL_MARCH2_verdict.log). RESULT 1 (regularization): sigma rose 2.4e-3 ->
  8.1e-3 (linear in A2, slope 1.25 per unit A2) and did not reach the 1e-2 the form named,
  so the letter renders KM2-NOT-REGULAR; but the charter''s operational test GATED at every
  control -- p39 rms 5.6e-10, p49 6.9e-10, p59 4.0e-10, p69 2.2e-10, p79 1.3e-10, p89
  2.9e-11 -- where the same solver floored at 1.3e-7 at A2 0.0021 (ANTI-ARC-S288). The
  branch is regular from A2 ~0.0065 (sigma ~3e-3); the 1e-2 threshold was a guess written
  into the form, wrong by a factor three. Rendered as the letter requires and recorded as a
  mis-set threshold, not a failed prediction; the form was not rewritten after the data.
  RESULT 2 (the unchartered event, KM2-TURN): over two arc steps p46 -> p48 (A2 0.00723 ->
  0.00740) the rate fell 1.32e-3 -> 8.15e-4 (-40 pct; 8.7e-4 thereafter), f_dir fell 0.592
  -> 0.427 (recovering to 0.50 by p89), V_pt spiked 7.60e-3 -> 7.96e-3 then fell to 6.43e-3,
  and om2 LEFT THE RESONANCE (detuning -2.6e-5 at p30 -> -5.6e-4 at p89, doubling per step
  through the turn, then linear); all points gated (p47 at 9.2e-9); sigma smooth through
  it; b_step ~2e-6 with a sign flip at the turn. NOT the aligned collapse signature (rate
  down 30x with f_dir UP); a sharp change of character from a resonant, phase-dominated
  branch to a non-resonant, displacement-heavier branch that continues. C1 as chartered
  (last 10 vs first 10 of the extension) = -0.11: no collapse form fires; no form names
  the event. WHAT STANDS: the anti-aligned family is flat AND GN-gateable from A2 0.0065 to
  0.0072 -- FND-176''s handedness-selective flatness holds on a REGULAR branch for that
  interval (REGULAR-FLAT in substance; the form did not fire because of the threshold);
  the "the degeneracy protected it" reading (REGULAR-COLLAPSE) is ruled out; beyond 0.0073
  the anti-aligned object is a different branch (off resonance, rate 0.87e-3, f_dir ~0.5),
  still flat in the C1 sense to 0.0102. HYPOTHESES (not findings): (a) a fold or branch
  point of the resonant family near 0.0073 with the march continuing onto the non-resonant
  continuation; (b) a branch switch induced by the bordering constraint once the degeneracy
  was nearly lifted; (c) the anti-aligned family''s own collapse mode with the opposite f_dir
  sign. NAMED NEXT-ORDER, KM-TURN (executed 2026-09-19..22: TURN-UNRESOLVED by the letter;
  the record shows two branches, R resonant and N non-resonant, crossing at A2 ~0.00733
  where the plain solver floors; KM-TURN-2, executed 2026-09-22..23, continued R across the
  crossing: R-CONTINUES-FLAT, 12/12 on R to A2 0.0086; analysis/KM_TURN_results.md,
